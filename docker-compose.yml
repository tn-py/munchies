name: munchies

services:
  postgres:
    image: postgres:15-alpine
    container_name: munchies-postgres
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: medusa
      POSTGRES_DB: medusa_munchies
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa -d medusa_munchies"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: munchies-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  medusa:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: munchies-medusa
    working_dir: /app/apps/medusa-backend
    # Run migrations first — required on a fresh database; idempotent on subsequent starts
    command: sh -c "pnpm exec medusa db:migrate && pnpm dev"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "9000:9000"
    volumes:
      - .:/app
      # Named volumes shadow the bind-mount so the image's node_modules are used,
      # not whatever may (or may not) exist on the host.
      - medusa_root_nm:/app/node_modules
      - medusa_app_nm:/app/apps/medusa-backend/node_modules
    env_file:
      - ./apps/medusa-backend/.env
    environment:
      # Override localhost URLs with Docker service names
      DATABASE_URL: postgres://medusa:medusa@postgres:5432/medusa_munchies?sslmode=disable
      REDIS_URL: redis://redis:6379

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: munchies-web
    working_dir: /app/apps/web
    # host networking lets workerd reach localhost:9000 (medusa's mapped port).
    # wrangler reads MEDUSA_BACKEND_URL from .env (http://localhost:9000), which
    # works here because the container shares the host's network interface.
    network_mode: host
    command: pnpm exec astro dev --port 3000 --host 0.0.0.0
    depends_on:
      - medusa
    volumes:
      - .:/app
      - web_root_nm:/app/node_modules
      - web_app_nm:/app/apps/web/node_modules
    env_file:
      - ./apps/web/.env

volumes:
  postgres_data:
  medusa_root_nm:
  medusa_app_nm:
  web_root_nm:
  web_app_nm:
